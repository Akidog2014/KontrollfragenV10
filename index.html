<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontrollformular V10</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 650px;
    margin: 20px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.security {
    background: #111;
    color: white;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
}

.section {
    margin-bottom: 25px;
}

h2 {
    margin-top: 0;
}

h3 {
    border-bottom: 1px solid #ccc;
    padding-bottom: 8px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
}

input,
textarea,
select {
    padding: 10px;
    width: 100%;
    margin-top: 5px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 16px;
}

textarea {
    resize: vertical;
}

.hidden {
    display: none !important;
}

.radio-group {
    margin-top: 7px;
    margin-bottom: 7px;
}

.radio-group input {
    width: auto;
    margin-right: 5px;
}

.checkbox-label {
    font-weight: normal;
}

.sub-option {
    margin-left: 25px;
    font-weight: normal;
}

button {
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
    width: 100%;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn {
    background: #333;
    color: white;
}

.btn:hover {
    background: #222;
}

.btn-green {
    background: #198754;
    color: white;
}

.btn-red {
    background: #b02a37;
    color: white;
}

.warning {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    padding: 12px;
    border-radius: 5px;
    margin-bottom: 20px;
}

.status {
    font-size: 13px;
    text-align: center;
    color: #555;
    margin-top: 10px;
}

.error {
    background: #f8d7da;
    color: #842029;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
}

.success {
    background: #d1e7dd;
    color: #0f5132;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="security">
        🔐 KONTROLLFORMULAR – V10
    </div>

    <div id="loginBox">

        <h2>Sicherheitsprüfung</h2>

        <div class="warning">
            Der Zugriff auf dieses Formular ist geschützt.
            Bitte geben Sie Ihre V10-PIN ein.
        </div>

        <label for="pin">V10-PIN</label>
        <input
            type="password"
            id="pin"
            inputmode="numeric"
            autocomplete="off"
            maxlength="32"
            placeholder="PIN eingeben"
        >

        <button class="btn" onclick="entsperren()">
            Formular entsperren
        </button>

        <div id="loginError" class="error hidden"></div>

    </div>


    <div id="formular" class="hidden">

        <div class="success">
            🔓 Formular entsperrt
        </div>

        <div class="status">
            Sitzung läuft automatisch nach 10 Minuten Inaktivität ab.
        </div>

        <hr>

        <h2>Kontrollformular</h2>


        <!-- PERSON -->
        <div class="section">

            <label for="name">Nachname:</label>
            <input type="text" id="name" autocomplete="off">

            <label for="vorname">Vorname:</label>
            <input type="text" id="vorname" autocomplete="off">

            <label for="geburtsdatum">
                Geburtsdatum (TT.MM.JJJJ):
            </label>

            <input
                type="text"
                id="geburtsdatum"
                maxlength="10"
                placeholder="13.03.1982"
                autocomplete="off"
            >

        </div>


        <!-- ALKOHOL -->
        <button class="btn" onclick="alkoholClicked()">
            Alkohol
        </button>

        <div id="alkohol-section" class="section hidden">

            <label for="alkohol-datum">Datum:</label>
            <input type="text" id="alkohol-datum" readonly>

            <label for="alkohol-zeit">Zeit:</label>
            <input type="text" id="alkohol-zeit" readonly>

            <label for="alkoholwert">
                Alkoholwert:
            </label>

            <input
                type="number"
                id="alkoholwert"
                step="0.01"
                min="0"
                inputmode="decimal"
            >

        </div>


        <!-- DROGEN -->
        <button class="btn" onclick="drogenClicked()">
            Drogen
        </button>

        <div id="drogen-section" class="section hidden">

            <label for="drogen-datum">Datum:</label>
            <input type="text" id="drogen-datum" readonly>

            <label for="drogen-zeit">Zeit:</label>
            <input type="text" id="drogen-zeit" readonly>


            <label class="checkbox-label">
                <input
                    type="checkbox"
                    id="drogen-pos"
                    onchange="drogenPositivChanged()"
                >
                positiv
            </label>

            <label class="checkbox-label">
                <input
                    type="checkbox"
                    id="drogen-neg"
                    onchange="drogenNegativChanged()"
                >
                negativ
            </label>


            <div id="drogen-checklist" class="hidden">

                <label class="sub-option">
                    <input type="checkbox" id="drogen-can">
                    Cannabis
                </label>

                <label class="sub-option">
                    <input type="checkbox" id="drogen-benzo">
                    Benzodiazepine
                </label>

                <label class="sub-option">
                    <input type="checkbox" id="drogen-amp">
                    Amphetamine
                </label>

                <label class="sub-option">
                    <input type="checkbox" id="drogen-kok">
                    Kokain
                </label>

                <label class="sub-option">
                    <input type="checkbox" id="drogen-opi">
                    Opiate
                </label>

            </div>

        </div>


        <!-- WEITERE FRAGEN -->
        <div class="section">

            <h3>Weitere Fragen</h3>


            <div>
                <label>
                    Leiden Sie gegenwärtig an einer Krankheit?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="krankheit"
                        id="krankheit-ja"
                        value="ja"
                        onchange="toggleTextfield('krankheit')"
                    > Ja

                    <input
                        type="radio"
                        name="krankheit"
                        id="krankheit-nein"
                        value="nein"
                        onchange="toggleTextfield('krankheit')"
                    > Nein

                </div>

                <textarea
                    id="krankheit-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="aerztliche"
                        id="aerztliche-ja"
                        value="ja"
                        onchange="toggleTextfield('aerztliche')"
                    > Ja

                    <input
                        type="radio"
                        name="aerztliche"
                        id="aerztliche-nein"
                        value="nein"
                        onchange="toggleTextfield('aerztliche')"
                    > Nein

                </div>

                <textarea
                    id="aerztliche-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Benötigen Sie Medikamente?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="medikamente"
                        id="medikamente-ja"
                        value="ja"
                        onchange="toggleTextfield('medikamente')"
                    > Ja

                    <input
                        type="radio"
                        name="medikamente"
                        id="medikamente-nein"
                        value="nein"
                        onchange="toggleTextfield('medikamente')"
                    > Nein

                </div>

                <textarea
                    id="medikamente-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="weiterepersonen"
                        id="weiterepersonen-ja"
                        value="ja"
                        onchange="toggleTextfield('weiterepersonen')"
                    > Ja

                    <input
                        type="radio"
                        name="weiterepersonen"
                        id="weiterepersonen-nein"
                        value="nein"
                        onchange="toggleTextfield('weiterepersonen')"
                    > Nein

                </div>

                <textarea
                    id="weiterepersonen-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="personen_notlage"
                        id="personen_notlage-ja"
                        value="ja"
                        onchange="toggleTextfield('personen_notlage')"
                    > Ja

                    <input
                        type="radio"
                        name="personen_notlage"
                        id="personen_notlage-nein"
                        value="nein"
                        onchange="toggleTextfield('personen_notlage')"
                    > Nein

                </div>

                <textarea
                    id="personen_notlage-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="tiere_notlage"
                        id="tiere_notlage-ja"
                        value="ja"
                        onchange="toggleTextfield('tiere_notlage')"
                    > Ja

                    <input
                        type="radio"
                        name="tiere_notlage"
                        id="tiere_notlage-nein"
                        value="nein"
                        onchange="toggleTextfield('tiere_notlage')"
                    > Nein

                </div>

                <textarea
                    id="tiere_notlage-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>


            <div>
                <label>
                    Müssen Sie etwas Dringendes erledigen?
                </label>

                <div class="radio-group">

                    <input
                        type="radio"
                        name="dringend"
                        id="dringend-ja"
                        value="ja"
                        onchange="toggleTextfield('dringend')"
                    > Ja

                    <input
                        type="radio"
                        name="dringend"
                        id="dringend-nein"
                        value="nein"
                        onchange="toggleTextfield('dringend')"
                    > Nein

                </div>

                <textarea
                    id="dringend-textarea"
                    class="hidden"
                    rows="3"
                    placeholder="Bitte beschreiben..."
                ></textarea>

            </div>

        </div>


        <button
            class="btn-green"
            onclick="sendeEmail()"
        >
            🔐 Daten verschlüsseln und weiter
        </button>


        <button
            class="btn-red"
            onclick="sitzungLoeschen()"
        >
            Sitzung sperren und Daten löschen
        </button>

    </div>

</div>


<script>

/* =========================================================
   V10 SICHERHEIT
   ========================================================= */

const SESSION_TIMEOUT = 10 * 60 * 1000;

let letzteAktivitaet = Date.now();
let sessionTimer = null;


/* ---------------------------------------------------------
   Hilfsfunktionen
--------------------------------------------------------- */

function zufallsBytes(anzahl) {

    const array = new Uint8Array(anzahl);

    crypto.getRandomValues(array);

    return array;
}


function bytesToBase64(bytes) {

    let binary = "";

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    return btoa(binary);
}


function base64ToBytes(base64) {

    const binary = atob(base64);

    const bytes = new Uint8Array(binary.length);

    for(let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}


/* ---------------------------------------------------------
   PIN -> AES Schlüssel
--------------------------------------------------------- */

async function schluesselAusPIN(pin, salt) {

    const encoder = new TextEncoder();

    const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(pin),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 250000,
            hash: "SHA-256"
        },
        material,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}


/* ---------------------------------------------------------
   Daten verschlüsseln
--------------------------------------------------------- */

async function verschluesseln(daten, pin) {

    const encoder = new TextEncoder();

    const salt = zufallsBytes(16);
    const iv = zufallsBytes(12);

    const key = await schluesselAusPIN(pin, salt);

    const verschluesselteDaten = await crypto.subtle.encrypt(
        {
            name: "AES-GCM",
            iv: iv
        },
        key,
        encoder.encode(JSON.stringify(daten))
    );

    return {

        salt: bytesToBase64(salt),

        iv: bytesToBase64(iv),

        data: bytesToBase64(
            new Uint8Array(verschluesselteDaten)
        )

    };
}


/* =========================================================
   PIN
   ========================================================= */

async function entsperren() {

    const pin = document.getElementById("pin").value.trim();

    const error = document.getElementById("loginError");

    error.classList.add("hidden");

    /*
       WICHTIG:

       Hier kannst du deine eigene V10-PIN festlegen.

       Beispiel:
       482917

       Diese PIN ist nur ein Client-Schutz.
       Für echten Zugriffsschutz muss die Authentifizierung
       serverseitig erfolgen.
    */

    const V10_PIN = "482917";


    if(pin.length < 6) {

        error.textContent =
            "Die PIN muss mindestens 6 Zeichen lang sein.";

        error.classList.remove("hidden");

        return;
    }


    if(pin !== V10_PIN) {

        error.textContent =
            "Ungültige V10-PIN.";

        error.classList.remove("hidden");

        document.getElementById("pin").value = "";

        return;
    }


    document.getElementById("loginBox")
        .classList.add("hidden");

    document.getElementById("formular")
        .classList.remove("hidden");


    starteSitzung();

    document.getElementById("pin").value = "";
}


/* =========================================================
   SESSION TIMEOUT
   ========================================================= */

function aktivitaet() {

    letzteAktivitaet = Date.now();

    if(!sessionTimer) {

        starteSitzung();

    }

}


function starteSitzung() {

    letzteAktivitaet = Date.now();

    clearInterval(sessionTimer);

    sessionTimer = setInterval(() => {

        if(
            Date.now() - letzteAktivitaet
            >= SESSION_TIMEOUT
        ) {

            sitzungLoeschen();

        }

    }, 10000);

}


function sitzungLoeschen() {

    sessionStorage.removeItem("v10_formular");

    clearInterval(sessionTimer);

    sessionTimer = null;

    document.getElementById("formular")
        .classList.add("hidden");

    document.getElementById("loginBox")
        .classList.remove("hidden");

    document.getElementById("pin").value = "";

    document.querySelectorAll(
        "input, textarea"
    ).forEach(element => {

        if(
            element.type === "radio" ||
            element.type === "checkbox"
        ) {

            element.checked = false;

        } else {

            element.value = "";

        }

    });

}


/* Aktivität überwachen */

[
    "click",
    "keydown",
    "touchstart",
    "mousemove"
].forEach(eventName => {

    document.addEventListener(
        eventName,
        aktivitaet,
        { passive: true }
    );

});


/* =========================================================
   GEBURTSDATUM
   ========================================================= */

function formatGeburtsdatum(input) {

    let v = input.value.replace(/\D/g, "");

    if(v.length >= 2) {

        v =
            v.slice(0,2) +
            "." +
            v.slice(2);

    }

    if(v.length >= 5) {

        v =
            v.slice(0,5) +
            "." +
            v.slice(5,9);

    }

    input.value = v;

}


document
    .getElementById("geburtsdatum")
    .addEventListener(
        "input",
        function() {

            formatGeburtsdatum(this);

        }
    );


/* =========================================================
   ALKOHOL
   ========================================================= */

function alkoholClicked() {

    document
        .getElementById("alkohol-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById(
        "alkohol-datum"
    ).value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById(
        "alkohol-zeit"
    ).value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


/* =========================================================
   DROGEN
   ========================================================= */

function drogenClicked() {

    document
        .getElementById("drogen-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById(
        "drogen-datum"
    ).value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById(
        "drogen-zeit"
    ).value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


function drogenPositivChanged() {

    const positiv =
        document.getElementById(
            "drogen-pos"
        ).checked;

    const negativ =
        document.getElementById(
            "drogen-neg"
        );

    if(positiv) {

        negativ.checked = false;

    }

    document
        .getElementById("drogen-checklist")
        .classList.toggle(
            "hidden",
            !positiv
        );

}


function drogenNegativChanged() {

    const negativ =
        document.getElementById(
            "drogen-neg"
        ).checked;

    const positiv =
        document.getElementById(
            "drogen-pos"
        );

    if(negativ) {

        positiv.checked = false;

        document
            .getElementById("drogen-checklist")
            .classList.add("hidden");

    }

}


/* =========================================================
   TEXTFELDER
   ========================================================= */

function toggleTextfield(qid) {

    const ja =
        document.getElementById(
            qid + "-ja"
        );

    const textarea =
        document.getElementById(
            qid + "-textarea"
        );

    textarea.classList.toggle(
        "hidden",
        !ja.checked
    );

}


/* =========================================================
   DATEN SAMMELN
   ========================================================= */

function formularDatenSammeln() {

    const daten = {

        version: "V10",

        zeitpunkt:
            new Date().toISOString(),

        person: {

            nachname:
                document.getElementById("name").value.trim(),

            vorname:
                document.getElementById("vorname").value.trim(),

            geburtsdatum:
                document.getElementById("geburtsdatum").value.trim()

        },

        alkohol: null,

        drogen: null,

        fragen: {}

    };


    /* Alkohol */

    if(
        !document
            .getElementById("alkohol-section")
            .classList
            .contains("hidden")
    ) {

        daten.alkohol = {

            datum:
                document.getElementById(
                    "alkohol-datum"
                ).value,

            zeit:
                document.getElementById(
                    "alkohol-zeit"
                ).value,

            wert:
                document.getElementById(
                    "alkoholwert"
                ).value

        };

    }


    /* Drogen */

    if(
        !document
            .getElementById("drogen-section")
            .classList
            .contains("hidden")
    ) {

        daten.drogen = {

            datum:
                document.getElementById(
                    "drogen-datum"
                ).value,

            zeit:
                document.getElementById(
                    "drogen-zeit"
                ).value,

            resultat:
                document.getElementById(
                    "drogen-pos"
                ).checked
                ? "positiv"
                :
                document.getElementById(
                    "drogen-neg"
                ).checked
                ? "negativ"
                : "Keine Angabe",

            substanzen: []

        };


        const drogen = [

            ["drogen-can", "Cannabis"],

            ["drogen-benzo", "Benzodiazepine"],

            ["drogen-amp", "Amphetamine"],

            ["drogen-kok", "Kokain"],

            ["drogen-opi", "Opiate"]

        ];


        drogen.forEach(item => {

            if(
                document.getElementById(
                    item[0]
                ).checked
            ) {

                daten.drogen.substanzen.push(
                    item[1]
                );

            }

        });

    }


    /* Fragen */

    const fragen = [

        [
            "krankheit",
            "Leiden Sie gegenwärtig an einer Krankheit?"
        ],

        [
            "aerztliche",
            "Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?"
        ],

        [
            "medikamente",
            "Benötigen Sie Medikamente?"
        ],

        [
            "weiterepersonen",
            "Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?"
        ],

        [
            "personen_notlage",
            "Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        ],

        [
            "tiere_notlage",
            "Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        ],

        [
            "dringend",
            "Müssen Sie etwas Dringendes erledigen?"
        ]

    ];


    fragen.forEach(f => {

        const ja =
            document.getElementById(
                f[0] + "-ja"
            ).checked;

        const nein =
            document.getElementById(
                f[0] + "-nein"
            ).checked;

        const textarea =
            document.getElementById(
                f[0] + "-textarea"
            );


        daten.fragen[f[0]] = {

            frage: f[1],

            antwort:
                ja
                ? "Ja"
                : nein
                ? "Nein"
                : "Keine Angabe",

            details:
                ja && textarea
                ? textarea.value.trim()
                : ""

        };

    });


    return daten;

}


/* =========================================================
   VALIDIERUNG
   ========================================================= */

function validiereDaten(daten) {

    if(!daten.person.nachname) {

        alert("Bitte Nachname eingeben.");

        return false;

    }


    if(!daten.person.vorname) {

        alert("Bitte Vorname eingeben.");

        return false;

    }


    if(!/^\d{2}\.\d{2}\.\d{4}$/.test(
        daten.person.geburtsdatum
    )) {

        alert(
            "Bitte ein gültiges Geburtsdatum im Format TT.MM.JJJJ eingeben."
        );

        return false;

    }


    if(
        daten.alkohol &&
        daten.alkohol.wert !== "" &&
        Number(daten.alkohol.wert) < 0
    ) {

        alert(
            "Der Alkoholwert darf nicht negativ sein."
        );

        return false;

    }


    return true;

}


/* =========================================================
   WEITER
   ========================================================= */

async function sendeEmail() {

    const daten =
        formularDatenSammeln();


    if(!validiereDaten(daten)) {

        return;

    }


    const bestaetigung = confirm(
        "Die erfassten Daten werden jetzt verschlüsselt " +
        "und an die Empfängerauswahl übergeben.\n\n" +
        "Möchten Sie fortfahren?"
    );


    if(!bestaetigung) {

        return;

    }


    try {

        const pin = prompt(
            "Bitte V10-PIN erneut eingeben, " +
            "um die Daten für die nächste Seite zu verschlüsseln:"
        );


        if(!pin) {

            return;

        }


        const verschluesselteDaten =
            await verschluesseln(
                daten,
                pin
            );


        /*
           Nur verschlüsselte Daten werden gespeichert.
           Keine sensiblen Daten in der URL.
        */

        sessionStorage.setItem(
            "v10_formular",
            JSON.stringify(
                verschluesselteDaten
            )
        );


        window.location.href =
            "email.html";

    }
    catch(error) {

        console.error(error);

        alert(
            "Die Daten konnten nicht sicher verschlüsselt werden."
        );

    }

}


/* =========================================================
   ENTER-TASTE
   ========================================================= */

document
    .getElementById("pin")
    .addEventListener(
        "keydown",
        function(event) {

            if(event.key === "Enter") {

                entsperren();

            }

        }
    );


</script>
