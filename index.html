<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontrollformular V10</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
}

h2 {
    margin-bottom: 20px;
}

h3 {
    margin-top: 25px;
}

.section {
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

input,
textarea {
    box-sizing: border-box;
    padding: 8px;
    width: 100%;
    margin-top: 5px;
    font-size: 16px;
}

textarea {
    resize: vertical;
}

.hidden {
    display: none;
}

.radio-group {
    margin-top: 5px;
    margin-bottom: 5px;
}

.radio-group input {
    width: auto;
    margin-right: 5px;
}

.sub-option {
    margin-left: 25px;
    font-weight: normal;
}

button {
    box-sizing: border-box;
    padding: 12px;
    font-size: 16px;
    margin-top: 8px;
    width: 100%;
    cursor: pointer;
    border: none;
    border-radius: 5px;
}

.btn-blue {
    background-color: #007bff;
    color: white;
}

.btn-green {
    background-color: #28a745;
    color: white;
}

.btn-gray {
    background-color: #6c757d;
    color: white;
}

.security-box {
    border: 2px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 25px;
    background-color: #f5f5f5;
}

.security-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.status {
    margin-top: 10px;
    font-weight: bold;
}

.success {
    color: #198754;
}

.error {
    color: #dc3545;
}

.info {
    color: #555;
    font-size: 14px;
    margin-top: 8px;
}

.locked {
    display: none;
}
</style>

<script>

/* =========================================================
   V10 EINSTELLUNGEN
   ========================================================= */

/*
   HIER DEIN PASSWORT EINTRAGEN
*/
const RICHTIGES_PASSWORT = "V10-2026";


/* =========================================================
   PASSWORT PRÜFEN
   ========================================================= */

function passwortPruefen() {

    const passwort =
        document.getElementById("passwort").value;

    const status =
        document.getElementById("password-status");

    if (passwort === RICHTIGES_PASSWORT) {

        /*
           Passwort nur für die aktuelle Browser-Sitzung
           merken.

           Es wird NICHT an email.html übergeben.
        */

        sessionStorage.setItem(
            "v10_authenticated",
            "true"
        );

        status.textContent =
            "Passwort korrekt. Formular freigegeben.";

        status.className =
            "status success";

        document
            .getElementById("login-bereich")
            .classList.add("hidden");

        document
            .getElementById("formular")
            .classList.remove("hidden");

    } else {

        status.textContent =
            "Falsches Passwort.";

        status.className =
            "status error";

        document.getElementById(
            "passwort"
        ).value = "";

        document.getElementById(
            "passwort"
        ).focus();
    }
}


/* Enter-Taste im Passwortfeld */

function passwortEnter(event) {

    if (event.key === "Enter") {

        passwortPruefen();
    }
}


/* =========================================================
   GEBURTSDATUM
   ========================================================= */

function formatGeburtsdatum(input) {

    let v =
        input.value.replace(/\D/g, "");

    if (v.length >= 2) {
        v =
            v.slice(0, 2) +
            "." +
            v.slice(2);
    }

    if (v.length >= 5) {
        v =
            v.slice(0, 5) +
            "." +
            v.slice(5, 9);
    }

    input.value = v;
}


/* =========================================================
   ALKOHOL
   ========================================================= */

function alkoholClicked() {

    document
        .getElementById("alkohol-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById(
        "alkohol-datum"
    ).value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById(
        "alkohol-zeit"
    ).value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}


/* =========================================================
   DROGEN
   ========================================================= */

function drogenClicked() {

    document
        .getElementById("drogen-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById(
        "drogen-datum"
    ).value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById(
        "drogen-zeit"
    ).value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}


/* =========================================================
   DROGEN POSITIV
   ========================================================= */

function drogenPositivChanged() {

    const positiv =
        document.getElementById(
            "drogen-pos"
        ).checked;

    document
        .getElementById("drogen-checklist")
        .classList.toggle(
            "hidden",
            !positiv
        );
}


/* =========================================================
   JA / NEIN TEXTFELDER
   ========================================================= */

function toggleTextfield(qid) {

    const ja =
        document.getElementById(
            qid + "-ja"
        );

    const textarea =
        document.getElementById(
            qid + "-textarea"
        );

    textarea.classList.toggle(
        "hidden",
        !ja.checked
    );
}


/* =========================================================
   FORMULAR TEXT ERSTELLEN
   ========================================================= */

function erstelleFormularText() {

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const vorname =
        document.getElementById(
            "vorname"
        ).value.trim();

    const geburtsdatum =
        document.getElementById(
            "geburtsdatum"
        ).value.trim();


    let text =
        "Info Festnahme\n\n";


    text +=
        "Name: " +
        name +
        "\n";

    text +=
        "Vorname: " +
        vorname +
        "\n";

    text +=
        "Geburtsdatum: " +
        geburtsdatum +
        "\n\n";


    /* =====================================================
       ALKOHOL
       ===================================================== */

    if (
        !document
            .getElementById(
                "alkohol-section"
            )
            .classList.contains(
                "hidden"
            )
    ) {

        const datum =
            document.getElementById(
                "alkohol-datum"
            ).value;

        const zeit =
            document.getElementById(
                "alkohol-zeit"
            ).value;

        const wert =
            document.getElementById(
                "alkoholwert"
            ).value;

        text +=
            "Alkoholkontrolle:\n";

        text +=
            "Datum: " +
            datum +
            "\n";

        text +=
            "Zeit: " +
            zeit +
            "\n";

        text +=
            "Wert: " +
            wert +
            "\n\n";
    }


    /* =====================================================
       DROGEN
       ===================================================== */

    if (
        !document
            .getElementById(
                "drogen-section"
            )
            .classList.contains(
                "hidden"
            )
    ) {

        const datum =
            document.getElementById(
                "drogen-datum"
            ).value;

        const zeit =
            document.getElementById(
                "drogen-zeit"
            ).value;

        text +=
            "Drogenkontrolle:\n";

        text +=
            "Datum: " +
            datum +
            "\n";

        text +=
            "Zeit: " +
            zeit +
            "\n";


        if (
            document
                .getElementById(
                    "drogen-pos"
                ).checked
        ) {

            text +=
                "Resultat: positiv\n";

            const drogenArten = [
                "can",
                "benzo",
                "amp",
                "kok",
                "opi"
            ];

            let any = false;

            drogenArten.forEach(
                d => {

                    const el =
                        document.getElementById(
                            "drogen-" + d
                        );

                    if (el.checked) {

                        text +=
                            "- " +
                            el.parentElement
                                .textContent
                                .trim() +
                            "\n";

                        any = true;
                    }
                }
            );

            if (!any) {

                text +=
                    "(Keine Substanzen ausgewählt)\n";
            }

            text += "\n";
        }


        if (
            document
                .getElementById(
                    "drogen-neg"
                ).checked
        ) {

            text +=
                "Resultat: negativ\n\n";
        }
    }


    /* =====================================================
       WEITERE FRAGEN
       ===================================================== */

    const fragen = [

        {
            id: "krankheit",
            text:
                "Leiden Sie gegenwärtig an einer Krankheit?"
        },

        {
            id: "aerztliche",
            text:
                "Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?"
        },

        {
            id: "medikamente",
            text:
                "Benötigen Sie Medikamente?"
        },

        {
            id: "weiterepersonen",
            text:
                "Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?"
        },

        {
            id: "personen_notlage",
            text:
                "Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        },

        {
            id: "tiere_notlage",
            text:
                "Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        },

        {
            id: "dringend",
            text:
                "Müssen Sie etwas Dringendes erledigen?"
        }
    ];


    fragen.forEach(
        f => {

            const ja =
                document.getElementById(
                    f.id + "-ja"
                ).checked;

            const nein =
                document.getElementById(
                    f.id + "-nein"
                ).checked;


            text +=
                f.text +
                ": " +
                (
                    ja
                        ? "Ja"
                        : (
                            nein
                                ? "Nein"
                                : "Keine Angabe"
                        )
                ) +
                "\n";


            const extra =
                document.getElementById(
                    f.id + "-textarea"
                );


            if (
                ja &&
                extra &&
                extra.value.trim() !== ""
            ) {

                text +=
                    "Details: " +
                    extra.value.trim() +
                    "\n";
            }


            text += "\n";
        }
    );


    return text;
}


/* =========================================================
   DATEN VORBEREITEN UND ZU EMAIL.HTML
   ========================================================= */

function emailSeiteOeffnen() {

    /*
       Sicherheitsprüfung
    */

    if (
        sessionStorage.getItem(
            "v10_authenticated"
        ) !== "true"
    ) {

        alert(
            "Bitte zuerst das Passwort eingeben."
        );

        return;
    }


    const text =
        erstelleFormularText();


    /*
       Die Formulardaten werden in der Sitzung
       zwischengespeichert.

       Es wird NICHT die URL verwendet.
    */

    sessionStorage.setItem(
        "v10_formular_daten",
        text
    );


    /*
       Auf der E-Mail-Seite wird kein Passwort
       mehr benötigt.
    */

    window.location.href =
        "email.html";
}


/* =========================================================
   SEITE LADEN
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        /*
           Alte Daten löschen, wenn index.html
           neu gestartet wird.
        */

        sessionStorage.removeItem(
            "v10_formular_daten"
        );

        sessionStorage.removeItem(
            "v10_authenticated"
        );


        document
            .getElementById("passwort")
            .focus();
    }
);

</script>

</head>

<body>


<h2>
    Kontrollformular – V10
</h2>


<!-- =====================================================
     PASSWORTBEREICH
     ===================================================== -->

<div
    id="login-bereich"
    class="security-box"
>

    <div class="security-title">
        Sicherheitsstufe V10
    </div>


    <label for="passwort">
        Passwort:
    </label>


    <input
        type="password"
        id="passwort"
        autocomplete="off"
        placeholder="Passwort eingeben"
        onkeydown="passwortEnter(event)"
    >


    <button
        type="button"
        class="btn-blue"
        onclick="passwortPruefen()"
    >
        Passwort bestätigen
    </button>


    <div
        id="password-status"
        class="status"
    ></div>


    <div class="info">
        Ohne korrektes Passwort kann das Formular
        nicht geöffnet werden.
    </div>

</div>


<!-- =====================================================
     FORMULAR
     ===================================================== -->

<div
    id="formular"
    class="hidden"
>


<div class="section">

    <label>
        Nachname:
    </label>

    <input
        type="text"
        id="name"
    >


    <label>
        Vorname:
    </label>

    <input
        type="text"
        id="vorname"
    >


    <label>
        Geburtsdatum (TTMMJJJJ):
    </label>

    <input
        type="text"
        id="geburtsdatum"
        maxlength="10"
        placeholder="13.03.1982"
        oninput="formatGeburtsdatum(this)"
    >

</div>


<!-- ALKOHOL -->

<button
    type="button"
    class="btn-blue"
    onclick="alkoholClicked()"
>
    Alkohol
</button>


<div
    id="alkohol-section"
    class="section hidden"
>

    <label>
        Datum:
    </label>

    <input
        type="text"
        id="alkohol-datum"
    >


    <label>
        Zeit:
    </label>

    <input
        type="text"
        id="alkohol-zeit"
    >


    <label>
        Alkoholwert:
    </label>

    <input
        type="number"
        id="alkoholwert"
        step="0.01"
    >

</div>


<!-- DROGEN -->

<button
    type="button"
    class="btn-blue"
    onclick="drogenClicked()"
>
    Drogen
</button>


<div
    id="drogen-section"
    class="section hidden"
>

    <label>
        Datum:
    </label>

    <input
        type="text"
        id="drogen-datum"
    >


    <label>
        Zeit:
    </label>

    <input
        type="text"
        id="drogen-zeit"
    >


    <label>
        <input
            type="checkbox"
            id="drogen-pos"
            onclick="drogenPositivChanged()"
        >
        positiv
    </label>


    <label>
        <input
            type="checkbox"
            id="drogen-neg"
        >
        negativ
    </label>


    <div
        id="drogen-checklist"
        class="hidden"
    >

        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-can"
            >
            Cannabis
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-benzo"
            >
            Benzodiazepine
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-amp"
            >
            Amphetamine
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-kok"
            >
            Kokain
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-opi"
            >
            Opiate
        </label>

    </div>

</div>


<!-- WEITERE FRAGEN -->

<div class="section">

<h3>
    Weitere Fragen
</h3>


<div>

<label>
    Leiden Sie gegenwärtig an einer Krankheit?
</label>

<div class="radio-group">

<input
    type="radio"
    name="krankheit"
    id="krankheit-ja"
    onchange="toggleTextfield('krankheit')"
>
Ja

<input
    type="radio"
    name="krankheit"
    id="krankheit-nein"
    onchange="toggleTextfield('krankheit')"
>
Nein

</div>

<textarea
    id="krankheit-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?
</label>

<div class="radio-group">

<input
    type="radio"
    name="aerztliche"
    id="aerztliche-ja"
    onchange="toggleTextfield('aerztliche')"
>
Ja

<input
    type="radio"
    name="aerztliche"
    id="aerztliche-nein"
    onchange="toggleTextfield('aerztliche')"
>
Nein

</div>

<textarea
    id="aerztliche-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Benötigen Sie Medikamente?
</label>

<div class="radio-group">

<input
    type="radio"
    name="medikamente"
    id="medikamente-ja"
    onchange="toggleTextfield('medikamente')"
>
Ja

<input
    type="radio"
    name="medikamente"
    id="medikamente-nein"
    onchange="toggleTextfield('medikamente')"
>
Nein

</div>

<textarea
    id="medikamente-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?
</label>

<div class="radio-group">

<input
    type="radio"
    name="weiterepersonen"
    id="weiterepersonen-ja"
    onchange="toggleTextfield('weiterepersonen')"
>
Ja

<input
    type="radio"
    name="weiterepersonen"
    id="weiterepersonen-nein"
    onchange="toggleTextfield('weiterepersonen')"
>
Nein

</div>

<textarea
    id="weiterepersonen-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
</label>

<div class="radio-group">

<input
    type="radio"
    name="personen_notlage"
    id="personen_notlage-ja"
    onchange="toggleTextfield('personen_notlage')"
>
Ja

<input
    type="radio"
    name="personen_notlage"
    id="personen_notlage-nein"
    onchange="toggleTextfield('personen_notlage')"
>
Nein

</div>

<textarea
    id="personen_notlage-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
</label>

<div class="radio-group">

<input
    type="radio"
    name="tiere_notlage"
    id="tiere_notlage-ja"
    onchange="toggleTextfield('tiere_notlage')"
>
Ja

<input
    type="radio"
    name="tiere_notlage"
    id="tiere_notlage-nein"
    onchange="toggleTextfield('tiere_notlage')"
>
Nein

</div>

<textarea
    id="tiere_notlage-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<div>

<label>
    Müssen Sie etwas Dringendes erledigen?
</label>

<div class="radio-group">

<input
    type="radio"
    name="dringend"
    id="dringend-ja"
    onchange="toggleTextfield('dringend')"
>
Ja

<input
    type="radio"
    name="dringend"
    id="dringend-nein"
    onchange="toggleTextfield('dringend')"
>
Nein

</div>

<textarea
    id="dringend-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


</div>


<!-- =====================================================
     E-MAIL BUTTON
     ===================================================== -->

<button
    type="button"
    class="btn-green"
    onclick="emailSeiteOeffnen()"
>
    E-Mail senden
</button>


</div>

</body>
</html>
