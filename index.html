<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontrollformular V10</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
    }

    h2 {
        margin-bottom: 20px;
    }

    h3 {
        margin-top: 25px;
    }

    .section {
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
    }

    input,
    textarea,
    select {
        box-sizing: border-box;
        padding: 8px;
        width: 100%;
        margin-top: 5px;
        font-size: 16px;
    }

    textarea {
        resize: vertical;
    }

    .hidden {
        display: none;
    }

    .radio-group {
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .radio-group input {
        width: auto;
        margin-right: 5px;
    }

    .checkbox-group input {
        width: auto;
        margin-right: 5px;
    }

    .sub-option {
        margin-left: 25px;
        font-weight: normal;
    }

    button {
        box-sizing: border-box;
        padding: 12px;
        font-size: 16px;
        margin-top: 8px;
        width: 100%;
        cursor: pointer;
        border: none;
        border-radius: 5px;
    }

    .btn-normal {
        background-color: #007bff;
        color: white;
    }

    .btn-green {
        background-color: #28a745;
        color: white;
    }

    .btn-disabled {
        background-color: #888;
        color: white;
        cursor: not-allowed;
    }

    .security-box {
        border: 2px solid #333;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        background-color: #f5f5f5;
    }

    .security-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .status {
        margin-top: 10px;
        font-weight: bold;
    }

    .success {
        color: #198754;
    }

    .error {
        color: #dc3545;
    }

    .info {
        color: #555;
        font-size: 14px;
        margin-top: 8px;
    }

    .locked {
        opacity: 0.5;
        pointer-events: none;
    }
</style>

<script>

/* =========================================================
   V10 - SICHERHEIT
   ========================================================= */

const V10_VERSION = "V10";

let verschluesselteDatenVorhanden = false;


/* ---------------------------------------------------------
   SHA-256 / PBKDF2 Schlüssel aus Sicherheitscode erzeugen
   --------------------------------------------------------- */

async function erstelleSchluessel(passwort) {

    const encoder = new TextEncoder();

    const passwortBytes = encoder.encode(passwort);

    const baseKey = await crypto.subtle.importKey(
        "raw",
        passwortBytes,
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    /*
       Fester Salt für diese Anwendung.
       Der Sicherheitscode selbst wird NICHT gespeichert.
    */

    const salt = encoder.encode("Kontrollformular-V10-Salt-2026");

    return await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 150000,
            hash: "SHA-256"
        },
        baseKey,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}


/* ---------------------------------------------------------
   Daten verschlüsseln
   --------------------------------------------------------- */

async function verschluesseln(text, schluessel) {

    const encoder = new TextEncoder();

    const iv = crypto.getRandomValues(
        new Uint8Array(12)
    );

    const verschluesselt = await crypto.subtle.encrypt(
        {
            name: "AES-GCM",
            iv: iv
        },
        schluessel,
        encoder.encode(text)
    );

    return {
        iv: arrayBufferZuBase64(iv),
        data: arrayBufferZuBase64(verschluesselt)
    };
}


/* ---------------------------------------------------------
   ArrayBuffer / Uint8Array -> Base64
   --------------------------------------------------------- */

function arrayBufferZuBase64(buffer) {

    const bytes = new Uint8Array(buffer);

    let binary = "";

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    return btoa(binary);
}


/* ---------------------------------------------------------
   Geburtsdatum formatieren
   --------------------------------------------------------- */

function formatGeburtsdatum(input) {

    let v = input.value.replace(/\D/g, "");

    if (v.length >= 2) {
        v = v.slice(0, 2) + "." + v.slice(2);
    }

    if (v.length >= 5) {
        v = v.slice(0, 5) + "." + v.slice(5, 9);
    }

    input.value = v;
}


/* ---------------------------------------------------------
   Alkohol Button
   --------------------------------------------------------- */

function alkoholClicked() {

    document
        .getElementById("alkohol-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById("alkohol-datum").value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById("alkohol-zeit").value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}


/* ---------------------------------------------------------
   Drogen Button
   --------------------------------------------------------- */

function drogenClicked() {

    document
        .getElementById("drogen-section")
        .classList.remove("hidden");

    const jetzt = new Date();

    document.getElementById("drogen-datum").value =
        jetzt.toLocaleDateString("de-CH");

    document.getElementById("drogen-zeit").value =
        jetzt.toLocaleTimeString(
            "de-CH",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}


/* ---------------------------------------------------------
   Drogen positiv
   --------------------------------------------------------- */

function drogenPositivChanged() {

    const pos =
        document.getElementById("drogen-pos").checked;

    document
        .getElementById("drogen-checklist")
        .classList.toggle(
            "hidden",
            !pos
        );
}


/* ---------------------------------------------------------
   Ja/Nein Textfeld
   --------------------------------------------------------- */

function toggleTextfield(qid) {

    const jaRadio =
        document.getElementById(qid + "-ja");

    const textarea =
        document.getElementById(qid + "-textarea");

    textarea.classList.toggle(
        "hidden",
        !jaRadio.checked
    );
}


/* =========================================================
   FORMULARDATEN SAMMELN
   ========================================================= */

function erstelleFormularText() {

    const name =
        document.getElementById("name").value.trim();

    const vorname =
        document.getElementById("vorname").value.trim();

    const geburtsdatum =
        document.getElementById("geburtsdatum").value.trim();


    let text = "";

    text += "Info Festnahme\n";
    text += "Sicherheitsstufe: " + V10_VERSION + "\n";
    text += "\n";

    text += "Name: " + name + "\n";
    text += "Vorname: " + vorname + "\n";
    text += "Geburtsdatum: " + geburtsdatum + "\n";
    text += "\n";


    /* -----------------------------------------------------
       Alkohol
       ----------------------------------------------------- */

    if (
        !document
            .getElementById("alkohol-section")
            .classList.contains("hidden")
    ) {

        const datum =
            document.getElementById("alkohol-datum").value;

        const zeit =
            document.getElementById("alkohol-zeit").value;

        const wert =
            document.getElementById("alkoholwert").value;

        text += "Alkoholkontrolle:\n";
        text += "Datum: " + datum + "\n";
        text += "Zeit: " + zeit + "\n";
        text += "Wert: " + wert + "\n";
        text += "\n";
    }


    /* -----------------------------------------------------
       Drogen
       ----------------------------------------------------- */

    if (
        !document
            .getElementById("drogen-section")
            .classList.contains("hidden")
    ) {

        const datum =
            document.getElementById("drogen-datum").value;

        const zeit =
            document.getElementById("drogen-zeit").value;

        text += "Drogenkontrolle:\n";
        text += "Datum: " + datum + "\n";
        text += "Zeit: " + zeit + "\n";


        if (
            document
                .getElementById("drogen-pos")
                .checked
        ) {

            text += "Resultat: positiv\n";

            const drogenArten = [
                "can",
                "benzo",
                "amp",
                "kok",
                "opi"
            ];

            let any = false;

            drogenArten.forEach(d => {

                const el =
                    document.getElementById(
                        "drogen-" + d
                    );

                if (el.checked) {

                    text +=
                        "- " +
                        el.parentElement.textContent.trim() +
                        "\n";

                    any = true;
                }
            });

            if (!any) {
                text +=
                    "(Keine Substanzen ausgewählt)\n";
            }

            text += "\n";
        }


        if (
            document
                .getElementById("drogen-neg")
                .checked
        ) {

            text +=
                "Resultat: negativ\n\n";
        }
    }


    /* -----------------------------------------------------
       Weitere Fragen
       ----------------------------------------------------- */

    const fragen = [

        {
            id: "krankheit",
            text:
                "Leiden Sie gegenwärtig an einer Krankheit?"
        },

        {
            id: "aerztliche",
            text:
                "Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?"
        },

        {
            id: "medikamente",
            text:
                "Benötigen Sie Medikamente?"
        },

        {
            id: "weiterepersonen",
            text:
                "Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?"
        },

        {
            id: "personen_notlage",
            text:
                "Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        },

        {
            id: "tiere_notlage",
            text:
                "Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?"
        },

        {
            id: "dringend",
            text:
                "Müssen Sie etwas Dringendes erledigen?"
        }
    ];


    fragen.forEach(f => {

        const ja =
            document
                .getElementById(
                    f.id + "-ja"
                )
                .checked;

        const nein =
            document
                .getElementById(
                    f.id + "-nein"
                )
                .checked;


        text +=
            f.text +
            ": " +
            (
                ja
                    ? "Ja"
                    : (
                        nein
                            ? "Nein"
                            : "Keine Angabe"
                    )
            ) +
            "\n";


        const extra =
            document.getElementById(
                f.id + "-textarea"
            );


        if (
            ja &&
            extra &&
            extra.value.trim() !== ""
        ) {

            text +=
                "Details: " +
                extra.value.trim() +
                "\n";
        }

        text += "\n";
    });


    return text;
}


/* =========================================================
   SICHERHEITSCODE PRÜFEN
   ========================================================= */

function sicherheitscodePruefen() {

    const code =
        document
            .getElementById("sicherheitscode")
            .value;

    const status =
        document.getElementById(
            "security-status"
        );


    if (!code || code.length < 6) {

        status.textContent =
            "Der Sicherheitscode muss mindestens 6 Zeichen enthalten.";

        status.className =
            "status error";

        return false;
    }


    /*
       Der Code wird nur für diese Sitzung im Speicher
       des Browsers verwendet.
    */

    sessionStorage.setItem(
        "v10_code",
        code
    );


    status.textContent =
        "Sicherheitscode akzeptiert.";

    status.className =
        "status success";


    document
        .getElementById("formular")
        .classList.remove("locked");


    return true;
}


/* =========================================================
   DATEN VERSCHLÜSSELN UND WEITER
   ========================================================= */

async function datenVerschluesselnUndWeiter() {

    const button =
        document.getElementById(
            "hauptButton"
        );


    /* Wenn bereits verschlüsselt:
       direkt zu email.html */

    if (verschluesselteDatenVorhanden) {

        window.location.href =
            "email.html";

        return;
    }


    const code =
        document
            .getElementById("sicherheitscode")
            .value;


    if (!code || code.length < 6) {

        alert(
            "Bitte zuerst einen gültigen Sicherheitscode eingeben."
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Daten werden verschlüsselt...";


    try {

        const schluessel =
            await erstelleSchluessel(code);


        const formularText =
            erstelleFormularText();


        const verschluesselt =
            await verschluesseln(
                formularText,
                schluessel
            );


        /*
           Nur die verschlüsselten Daten werden in
           sessionStorage abgelegt.
        */

        sessionStorage.setItem(
            "v10_encrypted_data",
            JSON.stringify(
                verschluesselt
            )
        );


        /*
           Der Schlüssel wird für diese Browser-Sitzung
           ebenfalls im Speicher gehalten.

           Der Sicherheitscode muss auf email.html
           deshalb nicht nochmals eingegeben werden.
        */

        sessionStorage.setItem(
            "v10_session_code",
            code
        );


        verschluesselteDatenVorhanden = true;


        button.textContent =
            "E-Mail senden";

        button.className =
            "btn-green";

        button.disabled = false;


        document.getElementById(
            "security-status"
        ).textContent =
            "Daten wurden erfolgreich verschlüsselt. Klicke jetzt auf «E-Mail senden».";


        document.getElementById(
            "security-status"
        ).className =
            "status success";


    } catch (error) {

        console.error(error);

        button.disabled = false;

        button.textContent =
            "Daten verschlüsseln und weiter";

        alert(
            "Fehler beim Verschlüsseln der Daten."
        );
    }
}


/* =========================================================
   INITIALISIERUNG
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        /*
           Falls eine alte Sitzung vorhanden ist,
           nicht automatisch übernehmen.
        */

        sessionStorage.removeItem(
            "v10_encrypted_data"
        );

        sessionStorage.removeItem(
            "v10_session_code"
        );

        verschluesselteDatenVorhanden =
            false;
    }
);

</script>

</head>

<body>

<h2>Kontrollformular – V10</h2>


<!-- =====================================================
     SICHERHEITSCODE
     ===================================================== -->

<div class="security-box">

    <div class="security-title">
        Sicherheitsstufe V10
    </div>

    <label for="sicherheitscode">
        Sicherheitscode:
    </label>

    <input
        type="password"
        id="sicherheitscode"
        autocomplete="off"
        placeholder="Sicherheitscode eingeben"
    >

    <button
        type="button"
        class="btn-normal"
        onclick="sicherheitscodePruefen()"
    >
        Sicherheitscode bestätigen
    </button>

    <div
        id="security-status"
        class="status"
    ></div>

    <div class="info">
        Der Sicherheitscode wird nicht in der URL übertragen.
    </div>

</div>


<!-- =====================================================
     FORMULAR
     ===================================================== -->

<div id="formular">


<div class="section">

    <label>
        Nachname:
    </label>

    <input
        type="text"
        id="name"
    >


    <label>
        Vorname:
    </label>

    <input
        type="text"
        id="vorname"
    >


    <label>
        Geburtsdatum (TTMMJJJJ):
    </label>

    <input
        type="text"
        id="geburtsdatum"
        maxlength="10"
        placeholder="13.03.1982"
        oninput="formatGeburtsdatum(this)"
    >

</div>


<!-- =====================================================
     ALKOHOL
     ===================================================== -->

<button
    type="button"
    class="btn-normal"
    onclick="alkoholClicked()"
>
    Alkohol
</button>


<div
    id="alkohol-section"
    class="section hidden"
>

    <label>
        Datum:
    </label>

    <input
        type="text"
        id="alkohol-datum"
    >


    <label>
        Zeit:
    </label>

    <input
        type="text"
        id="alkohol-zeit"
    >


    <label>
        Alkoholwert:
    </label>

    <input
        type="number"
        id="alkoholwert"
        step="0.01"
    >

</div>


<!-- =====================================================
     DROGEN
     ===================================================== -->

<button
    type="button"
    class="btn-normal"
    onclick="drogenClicked()"
>
    Drogen
</button>


<div
    id="drogen-section"
    class="section hidden"
>

    <label>
        Datum:
    </label>

    <input
        type="text"
        id="drogen-datum"
    >


    <label>
        Zeit:
    </label>

    <input
        type="text"
        id="drogen-zeit"
    >


    <label>
        <input
            type="checkbox"
            id="drogen-pos"
            onclick="drogenPositivChanged()"
        >
        positiv
    </label>


    <label>
        <input
            type="checkbox"
            id="drogen-neg"
        >
        negativ
    </label>


    <div
        id="drogen-checklist"
        class="hidden"
    >

        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-can"
            >
            Cannabis
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-benzo"
            >
            Benzodiazepine
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-amp"
            >
            Amphetamine
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-kok"
            >
            Kokain
        </label>


        <label class="sub-option">
            <input
                type="checkbox"
                id="drogen-opi"
            >
            Opiate
        </label>

    </div>

</div>


<!-- =====================================================
     WEITERE FRAGEN
     ===================================================== -->

<div class="section">

<h3>
    Weitere Fragen
</h3>


<!-- Krankheit -->

<div>

<label>
    Leiden Sie gegenwärtig an einer Krankheit?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="krankheit"
        id="krankheit-ja"
        value="ja"
        onchange="toggleTextfield('krankheit')"
    >
    Ja

    <input
        type="radio"
        name="krankheit"
        id="krankheit-nein"
        value="nein"
        onchange="toggleTextfield('krankheit')"
    >
    Nein

</div>

<textarea
    id="krankheit-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Ärztliche Behandlung -->

<div>

<label>
    Waren Sie in letzter Zeit in regelmäßiger ärztlicher Behandlung?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="aerztliche"
        id="aerztliche-ja"
        value="ja"
        onchange="toggleTextfield('aerztliche')"
    >
    Ja

    <input
        type="radio"
        name="aerztliche"
        id="aerztliche-nein"
        value="nein"
        onchange="toggleTextfield('aerztliche')"
    >
    Nein

</div>

<textarea
    id="aerztliche-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Medikamente -->

<div>

<label>
    Benötigen Sie Medikamente?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="medikamente"
        id="medikamente-ja"
        value="ja"
        onchange="toggleTextfield('medikamente')"
    >
    Ja

    <input
        type="radio"
        name="medikamente"
        id="medikamente-nein"
        value="nein"
        onchange="toggleTextfield('medikamente')"
    >
    Nein

</div>

<textarea
    id="medikamente-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Weitere Personen -->

<div>

<label>
    Möchten Sie, dass wir weitere Personen über Ihre Festnahme informieren?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="weiterepersonen"
        id="weiterepersonen-ja"
        value="ja"
        onchange="toggleTextfield('weiterepersonen')"
    >
    Ja

    <input
        type="radio"
        name="weiterepersonen"
        id="weiterepersonen-nein"
        value="nein"
        onchange="toggleTextfield('weiterepersonen')"
    >
    Nein

</div>

<textarea
    id="weiterepersonen-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Personen in Obhut -->

<div>

<label>
    Befinden sich Personen in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="personen_notlage"
        id="personen_notlage-ja"
        value="ja"
        onchange="toggleTextfield('personen_notlage')"
    >
    Ja

    <input
        type="radio"
        name="personen_notlage"
        id="personen_notlage-nein"
        value="nein"
        onchange="toggleTextfield('personen_notlage')"
    >
    Nein

</div>

<textarea
    id="personen_notlage-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Tiere -->

<div>

<label>
    Befinden sich Tiere in Ihrer Obhut, welche ohne Ihre Anwesenheit in eine Notlage geraten?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="tiere_notlage"
        id="tiere_notlage-ja"
        value="ja"
        onchange="toggleTextfield('tiere_notlage')"
    >
    Ja

    <input
        type="radio"
        name="tiere_notlage"
        id="tiere_notlage-nein"
        value="nein"
        onchange="toggleTextfield('tiere_notlage')"
    >
    Nein

</div>

<textarea
    id="tiere_notlage-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


<!-- Dringendes -->

<div>

<label>
    Müssen Sie etwas Dringendes erledigen?
</label>

<div class="radio-group">

    <input
        type="radio"
        name="dringend"
        id="dringend-ja"
        value="ja"
        onchange="toggleTextfield('dringend')"
    >
    Ja

    <input
        type="radio"
        name="dringend"
        id="dringend-nein"
        value="nein"
        onchange="toggleTextfield('dringend')"
    >
    Nein

</div>

<textarea
    id="dringend-textarea"
    class="hidden"
    rows="3"
    placeholder="Bitte beschreiben..."
></textarea>

</div>


</div>


<!-- =====================================================
     HAUPTBUTTON
     ===================================================== -->

<button
    id="hauptButton"
    type="button"
    class="btn-green"
    onclick="datenVerschluesselnUndWeiter()"
>
    Daten verschlüsseln und weiter
</button>


</div>

</body>
</html>
