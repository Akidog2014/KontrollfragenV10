/* =========================================================
   DROPDOWN FÜLLEN
   ========================================================= */

function fuelleDropdown(id) {

    const select =
        document.getElementById(id);


    const standard =
        document.createElement("option");


    standard.value = "";

    standard.textContent =
        "-- Optional --";


    select.appendChild(
        standard
    );


    empfaengerListe.forEach(
        person => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                person.email;


            option.textContent =
                person.name;


            select.appendChild(
                option
            );

        }
    );
}


/* =========================================================
   BASE64 -> ARRAYBUFFER
   ========================================================= */

function base64ZuArrayBuffer(base64) {

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }


    return bytes.buffer;
}


/* =========================================================
   SCHLÜSSEL ERSTELLEN
   ========================================================= */

async function erstelleSchluessel(passwort) {

    const encoder =
        new TextEncoder();


    const passwortBytes =
        encoder.encode(
            passwort
        );


    const baseKey =
        await crypto.subtle.importKey(
            "raw",
            passwortBytes,
            "PBKDF2",
            false,
            ["deriveKey"]
        );


    const salt =
        encoder.encode(
            "Kontrollformular-V10-Salt-2026"
        );


    return await crypto.subtle.deriveKey(

        {
            name: "PBKDF2",

            salt: salt,

            iterations: 150000,

            hash: "SHA-256"
        },

        baseKey,

        {
            name: "AES-GCM",

            length: 256
        },

        false,

        [
            "encrypt",
            "decrypt"
        ]
    );
}


/* =========================================================
   DATEN ENTSCHLÜSSELN
   ========================================================= */

async function entschluesseln(
    verschluesselt,
    schluessel
) {

    const iv =
        new Uint8Array(
            base64ZuArrayBuffer(
                verschluesselt.iv
            )
        );


    const daten =
        base64ZuArrayBuffer(
            verschluesselt.data
        );


    const entschluesselt =
        await crypto.subtle.decrypt(

            {
                name: "AES-GCM",

                iv: iv
            },

            schluessel,

            daten
        );


    const decoder =
        new TextDecoder();


    return decoder.decode(
        entschluesselt
    );
}


/* =========================================================
   DATEN LADEN UND ENTSCHLÜSSELN
   ========================================================= */

async function ladeDaten() {

    const verschluesselteDaten =
        sessionStorage.getItem(
            "v10_encrypted_data"
        );


    const code =
        sessionStorage.getItem(
            "v10_session_code"
        );


    if (
        !verschluesselteDaten ||
        !code
    ) {

        document.getElementById(
            "preview"
        ).textContent =
            "Keine verschlüsselten Daten gefunden.";

        return;
    }


    try {

        const daten =
            JSON.parse(
                verschluesselteDaten
            );


        const schluessel =
            await erstelleSchluessel(
                code
            );


        const text =
            await entschluesseln(
                daten,
                schluessel
            );


        /*
           Nur zur Kontrolle im Browser.
           Die Daten bleiben im Arbeitsspeicher.
        */

        document.getElementById(
            "preview"
        ).textContent =
            text;


        /*
           Entschlüsselten Text für senden()
           temporär im Speicher halten.
        */

        window.v10EmailText =
            text;


    } catch (error) {

        console.error(error);

        document.getElementById(
            "preview"
        ).textContent =
            "Fehler beim Entschlüsseln der Daten.";

    }

}


/* =========================================================
   E-MAIL SENDEN
   ========================================================= */

function senden() {

    const text =
        window.v10EmailText;


    if (!text) {

        alert(
            "Die Formulardaten konnten nicht geladen werden."
        );

        return;
    }


    /* -----------------------------------------------------
       Empfänger auslesen
       ----------------------------------------------------- */

    const e1 =
        document
            .getElementById(
                "empfaenger1"
            )
            .value;


    const e2 =
        document
            .getElementById(
                "empfaenger2"
            )
            .value;


    const e3 =
        document
            .getElementById(
                "empfaenger3"
            )
            .value;


    const e4 =
        document
            .getElementById(
                "empfaenger4"
            )
            .value;


    /* -----------------------------------------------------
       Empfänger erstellen
       ----------------------------------------------------- */

    let emails = [];


    /*
       Marco immer hinzufügen
    */

    const marco =
        "marco.wueest@lu.ch";


    emails.push(
        marco
    );


    const alleEmpfaenger = [
        e1,
        e2,
        e3,
        e4
    ];


    alleEmpfaenger.forEach(
        email => {

            if (
                email &&
                !emails.includes(email)
            ) {

                emails.push(
                    email
                );
            }

        }
    );


    const empfaengerString =
        emails.join(";");


    /* -----------------------------------------------------
       E-Mail öffnen
       ----------------------------------------------------- */

    const subject =
        encodeURIComponent(
            "Info Festnahme"
        );


    const body =
        encodeURIComponent(
            text
        );


    window.location.href =
        "mailto:" +
        empfaengerString +
        "?subject=" +
        subject +
        "&body=" +
        body;
}


/* =========================================================
   ABBRECHEN
   ========================================================= */

function abbrechen() {

    const bestaetigung =
        confirm(
            "Möchtest du den Vorgang wirklich abbrechen?"
        );


    if (!bestaetigung) {
        return;
    }


    /*
       Verschlüsselte Daten und Sicherheitscode
       aus der Sitzung löschen.
    */

    sessionStorage.removeItem(
        "v10_encrypted_data"
    );

    sessionStorage.removeItem(
        "v10_session_code"
    );


    window.location.href =
        "index.html";
}
