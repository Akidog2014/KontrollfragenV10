/* =========================================================
   DROPDOWNS FÜLLEN
   ========================================================= */

function fuelleDropdown(id) {

    const select =
        document.getElementById(id);


    const standard =
        document.createElement("option");


    standard.value = "";

    standard.textContent =
        "-- Optional --";


    select.appendChild(
        standard
    );


    empfaengerListe.forEach(
        person => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                person.email;


            option.textContent =
                person.name;


            select.appendChild(
                option
            );
        }
    );
}


/* =========================================================
   DATEN LADEN
   ========================================================= */

function ladeDaten() {

    const daten =
        sessionStorage.getItem(
            "v10_formular_daten"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    if (!daten) {

        preview.textContent =
            "Es wurden keine Formulardaten gefunden.";

        document
            .getElementById("status")
            .classList.add("error");

        document
            .getElementById("status")
            .textContent =
            "Keine Formulardaten vorhanden.";

        return;
    }


    /*
       Daten nur zur Kontrolle anzeigen.
    */

    preview.textContent =
        daten;


    /*
       Für send() im Speicher verfügbar machen.
    */

    window.v10EmailText =
        daten;
}


/* =========================================================
   E-MAIL SENDEN
   ========================================================= */

function senden() {

    const text =
        window.v10EmailText;


    if (!text) {

        alert(
            "Keine Formulardaten vorhanden."
        );

        return;
    }


    const e1 =
        document.getElementById(
            "empfaenger1"
        ).value;

    const e2 =
        document.getElementById(
            "empfaenger2"
        ).value;

    const e3 =
        document.getElementById(
            "empfaenger3"
        ).value;

    const e4 =
        document.getElementById(
            "empfaenger4"
        ).value;


    /*
       Marco immer hinzufügen.
    */

    let emails = [
        "marco.wueest@lu.ch"
    ];


    const weitereEmpfaenger = [
        e1,
        e2,
        e3,
        e4
    ];


    weitereEmpfaenger.forEach(
        email => {

            if (
                email &&
                !emails.includes(email)
            ) {

                emails.push(email);
            }
        }
    );


    const empfaengerString =
        emails.join(";");


    const subject =
        encodeURIComponent(
            "Info Festnahme"
        );


    const body =
        encodeURIComponent(
            text
        );


    /*
       Daten werden vor dem Öffnen des
       Mailprogramms nicht in der URL der
       Webseite übertragen.

       mailto: wird vom Betriebssystem
       an das Standard-Mailprogramm übergeben.
    */

    window.location.href =
        "mailto:" +
        empfaengerString +
        "?subject=" +
        subject +
        "&body=" +
        body;
}


/* =========================================================
   ABBRECHEN
   ========================================================= */

function abbrechen() {

    if (
        !confirm(
            "Möchtest du den Vorgang wirklich abbrechen?"
        )
    ) {

        return;
    }


    /*
       Sensible Daten aus der Sitzung löschen.
    */

    sessionStorage.removeItem(
        "v10_formular_daten"
    );

    sessionStorage.removeItem(
        "v10_authenticated"
    );


    window.location.href =
        "index.html";
}
